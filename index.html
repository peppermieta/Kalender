<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg:       #F7F6F3;
    --surface:  #FFFFFF;
    --border:   #E2E0D8;
    --text:     #1A1A18;
    --muted:    #7A7870;
    --shadow:   0 2px 8px rgba(0,0,0,.07);
    --radius:   10px;

    --M09-bg: #E8F5ED; --M09-tx: #1A5C34; --M09-bd: #A8D5B5; --M09-dot: #2E8B57;
    --M07-bg: #EDE8FF; --M07-tx: #3B1D8C; --M07-bd: #B8A8F0; --M07-dot: #5B3FC8;
    --M06-bg: #E0F4EF; --M06-tx: #0D5A4A; --M06-bd: #8DD4C2; --M06-dot: #1A8C70;
    --M08-bg: #FEF3E2; --M08-tx: #7A5500; --M08-bd: #F5CC80; --M08-dot: #C48A00;
    --m10-bg:#FCE8EF; --m10-tx:#7A1038; --m10-bd:#F0A0BC; --m10-dot:#C41A50;
    --za-bg: #EEEEEC; --za-tx: #444440; --za-bd: #BBBBBA; --za-dot: #777775;
    --M02-bg: #E0EEFF; --M02-tx: #1A3A8C; --M02-bd: #A0BCEA; --M02-dot: #2050C8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-left h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.3px;
    color: var(--text);
  }
  .header-left p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }
  .module-link { color: #5B3FC8; font-weight: 600; text-decoration: none; }
  .module-link:hover { text-decoration: underline; }
  .nav-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    color: var(--text);
    transition: background .15s;
    font-weight: 500;
  }
  .nav-btn:hover { background: var(--border); }
  .month-label {
    font-size: 16px;
    font-weight: 700;
    min-width: 180px;
    text-align: center;
    letter-spacing: -.2px;
  }

  /* ── NÄCHSTE VERANSTALTUNG ── */
  .next-up {
    display: none; /* wird per JS auf 'flex' gesetzt, sobald ein kommender Termin feststeht */
    align-items: center;
    gap: 9px;
    padding: 11px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    flex-wrap: wrap;
    transition: filter .12s;
  }
  .next-up:hover { filter: brightness(.96); }
  .next-up-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .next-up-label { font-weight: 700; letter-spacing: .1px; }
  .next-up-when { font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: .8; }
  .next-up-sep { opacity: .45; }
  .next-up-title { font-weight: 500; }

  /* ── SUCHE + ABO-TOOLBAR ── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1 1 260px; max-width: 360px; }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; opacity: .55; pointer-events: none;
  }
  #searchInput {
    width: 100%; box-sizing: border-box;
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 13px;
    background: var(--bg); color: var(--text);
  }
  #searchInput:focus { outline: none; border-color: #5B3FC8; background: var(--surface); }
  .search-results {
    display: none;
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow);
    max-height: 320px; overflow-y: auto;
    z-index: 50;
  }
  .search-result {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; cursor: pointer; font-size: 12.5px;
    border-bottom: 1px solid var(--border);
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: var(--bg); }
  .search-result-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .search-result-date {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
    flex-shrink: 0; white-space: nowrap;
  }
  .search-result-title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .search-empty { padding: 12px; font-size: 12.5px; color: var(--muted); text-align: center; }

  .subscribe-wrap { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .subscribe-link {
    font-size: 12.5px; font-weight: 600; color: #5B3FC8; text-decoration: none;
    white-space: nowrap;
  }
  .subscribe-link:hover { text-decoration: underline; }
  .subscribe-copy {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--bg); color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .subscribe-copy:hover { background: var(--surface); color: var(--text); }
  .subscribe-copy.copied { color: #1A8C70; border-color: #8DD4C2; }

  /* ── LEGEND ── */
  .legend {
    display: flex;
    gap: 8px;
    padding: 10px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid;
    cursor: default;
    white-space: nowrap;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── CALENDAR GRID ── */
  .calendar-wrap { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  .weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .weekday-header div {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 0;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .cal-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 110px;
    padding: 8px 6px 6px;
    position: relative;
    overflow: hidden;
    transition: border-color .15s;
  }
  .cal-cell:hover { border-color: #AAAAAA; }
  .cal-cell.other-month { background: #F2F1EE; opacity: .5; }
  .cal-cell.today { border-color: #5B3FC8; border-width: 2px; }
  .cal-cell.has-ferien {
    background: repeating-linear-gradient(
      45deg,
      #F7F6F3 0px, #F7F6F3 6px,
      #EFEEEB 6px, #EFEEEB 12px
    );
  }

  .day-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .day-dow { display: none; } /* nur auf Mobile sichtbar, siehe Media Query unten */
  .day-num .today-badge {
    background: #5B3FC8;
    color: #fff;
    font-size: 11px;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .event-chip {
    display: block;
    font-size: 10.5px;
    font-weight: 500;
    padding: 3px 6px;
    border-radius: 5px;
    margin-bottom: 2px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
    transition: filter .12s, transform .1s;
    line-height: 1.3;
  }
  .event-chip:hover { filter: brightness(.93); transform: translateY(-1px); }
  .event-chip .chip-time { opacity: .75; font-size: 9.5px; margin-right: 3px; font-family: 'JetBrains Mono', monospace; }
  .event-chip .chip-mod { display: none; } /* nur auf Mobile sichtbar, siehe Media Query unten */
  .event-chip .chip-room { opacity: .8; font-weight: 500; }

  .more-btn {
    font-size: 10px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-weight: 500;
    background: none;
    border: none;
    font-family: inherit;
  }
  .more-btn:hover { background: var(--bg); color: var(--text); }

  /* ── MODULE CHIP STYLES ── */
  .chip-M09  { background: var(--M09-bg);  color: var(--M09-tx);  border-color: var(--M09-bd); }
  .chip-M07  { background: var(--M07-bg);  color: var(--M07-tx);  border-color: var(--M07-bd); }
  .chip-M06  { background: var(--M06-bg);  color: var(--M06-tx);  border-color: var(--M06-bd); }
  .chip-M08  { background: var(--M08-bg);  color: var(--M08-tx);  border-color: var(--M08-bd); }
  .chip-M10 { background: var(--m10-bg); color: var(--m10-tx); border-color: var(--m10-bd); }
  .chip-ZA  { background: var(--za-bg);  color: var(--za-tx);  border-color: var(--za-bd); }
  .chip-M02  { background: var(--M02-bg);  color: var(--M02-tx);  border-color: var(--M02-bd); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(2px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(10px);
    transition: transform .2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-header {
    padding: 20px 20px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .modal-modul-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid;
    letter-spacing: .3px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .modal-close {
    background: var(--bg);
    border: 1px solid var(--border);
    width: 32px; height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: var(--text);
    transition: background .15s;
  }
  .modal-close:hover { background: var(--border); }

  .modal-title {
    padding: 10px 20px 0;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -.2px;
  }

  .modal-body { padding: 16px 20px 20px; }

  .info-grid {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 10px 12px;
    font-size: 13.5px;
  }
  .info-label {
    font-weight: 600;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .4px;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .info-value { color: var(--text); line-height: 1.4; }
  .info-value.placeholder { color: var(--muted); font-style: italic; }
  .info-value.mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }
  .modal-divider {
    height: 1px;
    background: var(--border);
    margin: 14px 0;
  }

  /* ── FERIEN LABEL ── */
  .ferien-label {
    font-size: 10px;
    color: var(--muted);
    font-style: italic;
    margin-top: 4px;
  }

  /* ── SCROLL NAV DOTS ── */
  .month-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 12px 0 4px;
  }
  .month-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: background .15s, transform .15s;
    border: none;
  }
  .month-dot.active { background: var(--text); transform: scale(1.3); }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .calendar-wrap { padding: 12px; }
    .legend { display: none; }
    header { padding: 12px; }
    .next-up { padding: 10px 12px; font-size: 12.5px; }
    .next-up-label { display: none; } /* auf Mobile reicht Uhrzeit + Titel, spart Platz */
    .toolbar { padding: 10px 12px; gap: 10px; }
    .search-wrap { max-width: none; flex: 1 1 100%; }
    .subscribe-wrap { flex: 1 1 100%; justify-content: space-between; }

    /* Wochentagsleiste ausblenden – Wochentag steht jetzt direkt am Datum */
    .weekday-header { display: none; }

    /* Statt 7-Spalten-Raster: ein Tag pro Zeile, volle Breite */
    .cal-grid {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    /* Tage außerhalb des Monats blenden wir in der Liste komplett aus */
    .cal-cell.other-month { display: none; }

    .cal-cell {
      min-height: unset;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
    }

    .day-num { font-size: 15px; margin-bottom: 8px; }

    /* Wochentagskürzel vor der Tageszahl, nur mobil sichtbar */
    .day-dow {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 7px;
    }

    /* Termine dürfen jetzt umbrechen statt abgeschnitten zu werden */
    .event-chip {
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      font-size: 12.5px;
      line-height: 1.4;
      padding: 7px 9px;
    }
    .event-chip .chip-time { font-size: 11px; }
    .event-chip .chip-mod {
      display: inline-block;
      font-weight: 700;
      font-size: 11px;
      margin-right: 5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0,0,0,.08);
    }
  }
</style>
</head>

// ─── RÄUME / VERANSTALTUNGSORTE ─────────────────────────────────────────────
// Platzhalter: sobald die Raumnummern feststehen, hier einfach pro LV-Nummer
// eintragen – gilt dann automatisch für alle Termine dieser Veranstaltung.
// Beispiel:  "1-1-0021-1-12357-206206620209731": "Raum 2.14",
const ROOMS = {
  // "1-1-XXXX-1-XXXXX-XXXXXXXXXXXXXXX": "Gebäude/Raum",
};

// Raum je Termin setzen (LV-Nummer-Lookup; einzelne Termine können das mit
// einem eigenen "raum:"-Feld direkt im EVENTS-Eintrag überschreiben)
EVENTS.forEach(ev => {
  if (!ev.raum) ev.raum = ROOMS[ev.lvnr] || null;
});

// Sort by start time within same date
EVENTS.sort((a,b)=>a.start.localeCompare(b.start));

// Index by date
const byDate = {};
EVENTS.forEach(ev=>{
  if(!byDate[ev.date]) byDate[ev.date]=[]; byDate[ev.date].push(ev);
});

// Ferien dates
const FERIEN = new Set([
  "2026-12-21","2026-12-22","2026-12-23","2026-12-24","2026-12-25","2026-12-26","2026-12-27",
  "2026-12-28","2026-12-29","2026-12-30","2026-12-31",
  "2027-01-01","2027-01-02","2027-01-03","2027-01-04","2027-01-05","2027-01-06","2027-01-07","2027-01-08","2027-01-09","2027-01-10"
]);

// Months: Oct 2026 → Feb 2027
const MONTHS = [
  {year:2026,month:9},  // Oct (0-indexed)
  {year:2026,month:10}, // Nov
  {year:2026,month:11}, // Dec
  {year:2027,month:0},  // Jan
  {year:2027,month:1},  // Feb
];
const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTH_NAMES_SHORT = MONTH_NAMES.map(m => m.slice(0,3));
// Sonntag-first, passend zu Date.getDay() (0=So); für die Mo-first-Rastergrafik wird mit (i+1)%7 hineinindiziert
const WEEKDAY_ABBR = ['So','Mo','Di','Mi','Do','Fr','Sa'];

let currentMonthIdx = 0;

// ─── LEGEND ──────────────────────────────────────────────────────────────────
const legend = document.getElementById('legend');
Object.entries(MODS).forEach(([key,m])=>{
  const el = document.createElement('div');
  el.className = 'legend-item';
  el.style.cssText = `background:${m.bg};color:${m.tx};border-color:${m.bd}`;
  el.innerHTML = `<span class="legend-dot" style="background:${m.dot}"></span>${m.label}`;
  legend.appendChild(el);
});

// ─── MONTH DOTS ──────────────────────────────────────────────────────────────
const dotsEl = document.getElementById('monthDots');
MONTHS.forEach((_,i)=>{
  const btn = document.createElement('button');
  btn.className = 'month-dot' + (i===0?' active':'');
  btn.onclick = ()=>goTo(i);
  dotsEl.appendChild(btn);
});

function updateDots(){
  dotsEl.querySelectorAll('.month-dot').forEach((d,i)=>
    d.classList.toggle('active', i===currentMonthIdx));
}

// ─── RENDER CALENDAR ─────────────────────────────────────────────────────────
function isoDate(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }

function renderMonth(idx){
  const {year, month} = MONTHS[idx];
  document.getElementById('monthLabel').textContent =
    `${MONTH_NAMES[month]} ${year}`;

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstDay = new Date(year, month, 1);
  let startDow = firstDay.getDay(); // 0=Sun
  startDow = startDow===0 ? 6 : startDow-1; // Mon=0

  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev  = new Date(year, month, 0).getDate();

  const today = new Date();
  const todayISO = isoDate(today.getFullYear(), today.getMonth(), today.getDate());

  // Einmal pro Renderdurchlauf berechnen statt pro Zelle (Punkt 4)
  const isMobile = window.matchMedia('(max-width: 700px)').matches;
  const MAX_CHIPS = isMobile ? 6 : 3;

  // Fill grid: 6 weeks = 42 cells
  for(let i=0; i<42; i++){
    let dayNum, cellYear, cellMonth, otherMonth=false;
    if(i < startDow){
      dayNum = daysInPrev - startDow + i + 1;
      const pm = month===0?11:month-1;
      const py = month===0?year-1:year;
      cellYear=py; cellMonth=pm; otherMonth=true;
    } else if(i-startDow < daysInMonth){
      dayNum = i - startDow + 1;
      cellYear=year; cellMonth=month;
    } else {
      dayNum = i - startDow - daysInMonth + 1;
      const nm = month===11?0:month+1;
      const ny = month===11?year+1:year;
      cellYear=ny; cellMonth=nm; otherMonth=true;
    }

    const iso = isoDate(cellYear, cellMonth, dayNum);
    const isToday = iso===todayISO;
    const isFerien = FERIEN.has(iso) && !otherMonth;
    const events = (!otherMonth && byDate[iso]) || [];

    const cell = document.createElement('div');
    cell.className = 'cal-cell'
      + (otherMonth?' other-month':'')
      + (isToday?' today':'')
      + (isFerien?' has-ferien':'');

    // Day number (mit Wochentagskürzel für die mobile Listenansicht)
    const dowLabel = `<span class="day-dow">${WEEKDAY_ABBR[(i+1)%7]}</span>`;

    const dnEl = document.createElement('div');
    dnEl.className = 'day-num';
    if(isToday){
      dnEl.innerHTML = `${dowLabel}<span class="today-badge">${dayNum}</span>`;
    } else {
      dnEl.innerHTML = `${dowLabel}${dayNum}`;
    }
    cell.appendChild(dnEl);

    if(isFerien && !otherMonth){
      const fl = document.createElement('div');
      fl.className='ferien-label'; fl.textContent='Weihnachtsferien';
      cell.appendChild(fl);
    }

    // Event chips (auf Mobile mehr Platz, da Termine dort umbrechen statt abgeschnitten zu werden)
    events.sort((a,b)=>a.start.localeCompare(b.start));
    events.slice(0,MAX_CHIPS).forEach(ev=>{
      const chip = document.createElement('span');
      chip.className = `event-chip chip-${ev.modul}`;
      const modLabel = ev.modul;
      const roomHtml = ev.raum ? ` <span class="chip-room">· 📍 ${ev.raum}</span>` : '';
      chip.innerHTML = `<span class="chip-time">${ev.start}</span><span class="chip-mod">${modLabel}</span>${ev.title}${roomHtml}`;
      chip.onclick = (e)=>{ e.stopPropagation(); openModal(ev); };
      cell.appendChild(chip);
    });
    if(events.length > MAX_CHIPS){
      const more = document.createElement('button');
      more.className='more-btn';
      more.textContent = `+${events.length-MAX_CHIPS} weitere`;
      more.onclick=(e)=>{e.stopPropagation(); openDayModal(iso, events);}
      cell.appendChild(more);
    }

    grid.appendChild(cell);
  }
  updateDots();
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function goTo(idx){
  if(idx<0||idx>=MONTHS.length) return;
  currentMonthIdx=idx;
  renderMonth(idx);
}
document.getElementById('prevBtn').onclick=()=>goTo(currentMonthIdx-1);
document.getElementById('nextBtn').onclick=()=>goTo(currentMonthIdx+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') goTo(currentMonthIdx-1);
  if(e.key==='ArrowRight') goTo(currentMonthIdx+1);
  if(e.key==='Escape') closeModal();
});

// ─── MODAL ───────────────────────────────────────────────────────────────────
const overlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');

function openModal(ev){
  const m = MODS[ev.modul];
  const badge = document.getElementById('modalBadge');
  badge.textContent = ev.modul === 'ZA' ? 'Zusatzangebot' : ev.modul;
  badge.style.cssText = `background:${m.bg};color:${m.tx};border-color:${m.bd}`;

  document.getElementById('modalTitle').textContent = ev.title;

  const d = new Date(ev.date+'T12:00:00Z');
  const dateStr = `${WEEKDAY_ABBR[d.getUTCDay()]}, ${d.getUTCDate()}. ${MONTH_NAMES[d.getUTCMonth()]} ${d.getUTCFullYear()}`;

  const rows = [
    ['Datum',    dateStr],
    ['Uhrzeit',  `${ev.start} – ${ev.end} Uhr`],
    ['Raum',     ev.raum || 'wird noch bekannt gegeben'],
    ['Modul',    m.label],
    ['LV-Nummer', ev.lvnr],
    ['Parallelgruppe', `PG ${ev.pg}`],
  ];

  document.getElementById('modalInfo').innerHTML = rows.map(([l,v])=>`
    <span class="info-label">${l}</span>
    <span class="info-value${l==='LV-Nummer'?' mono':''}${l==='Raum' && !ev.raum ? ' placeholder':''}">${v}</span>
  `).join('');

  overlay.classList.add('open');
}

function openDayModal(iso, events){
  // For "more" – show first event, could extend to list all
  // We'll show a mini list by opening first then cycling won't hurt UX
  // For simplicity, open the first hidden event
  openModal(events[3] || events[0]);
}

function closeModal(){
  overlay.classList.remove('open');
}
modalClose.onclick = closeModal;
overlay.onclick = e=>{ if(e.target===overlay) closeModal(); };

// ─── TOUCH SWIPE (Monatsnavigation auf Mobile/Touch-Geräten) ────────────────
(function(){
  const wrap = document.querySelector('.calendar-wrap');
  let startX = 0, startY = 0;
  wrap.addEventListener('touchstart', e=>{
    startX = e.changedTouches[0].clientX;
    startY = e.changedTouches[0].clientY;
  }, {passive:true});
  wrap.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    // nur horizontale, eindeutige Wischgesten werten (sonst Konflikt mit vertikalem Scrollen)
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) goTo(currentMonthIdx + 1); // nach links wischen → nächster Monat
      else       goTo(currentMonthIdx - 1); // nach rechts wischen → vorheriger Monat
    }
  }, {passive:true});
})();

// ─── NÄCHSTE VERANSTALTUNG ──────────────────────────────────────────────────
function renderNextUp(){
  const el = document.getElementById('nextUp');
  if(!el) return;

  const now = new Date();
  const upcoming = EVENTS
    .map(ev => ({ ev, dt: new Date(`${ev.date}T${ev.start}:00`) }))
    .filter(x => x.dt.getTime() >= now.getTime())
    .sort((a, b) => a.dt - b.dt)[0];

  if(!upcoming){
    el.style.display = 'none';
    return;
  }

  const { ev } = upcoming;
  const m = MODS[ev.modul];
  const todayISO = isoDate(now.getFullYear(), now.getMonth(), now.getDate());
  const isToday = ev.date === todayISO;

  const dObj = new Date(ev.date + 'T12:00:00Z');
  const whenLabel = isToday
    ? `heute, ${ev.start} Uhr`
    : `${WEEKDAY_ABBR[dObj.getUTCDay()]}, ${dObj.getUTCDate()}. ${MONTH_NAMES_SHORT[dObj.getUTCMonth()]}, ${ev.start} Uhr`;

  el.style.display = 'flex';
  el.style.background = m.bg;
  el.style.color = m.tx;
  el.style.borderBottom = `1px solid ${m.bd}`;
  el.innerHTML = `
    <span class="next-up-dot" style="background:${m.dot}"></span>
    <span class="next-up-label">Nächste Veranstaltung</span>
    <span class="next-up-when">${whenLabel}</span>
    <span class="next-up-sep">·</span>
    <span class="next-up-title">${ev.title}</span>
  `;
  el.onclick = () => openModal(ev);
}

// ─── SUCHE ───────────────────────────────────────────────────────────────────
// Durchsucht Titel + Modulname. ev.lehrperson könnte hier künftig ergänzt
// werden, sobald eine Dozierenden-Suche wieder gewünscht ist (Datenfeld ist
// in EVENTS bereits vorhanden) – dazu einfach MODS[ev.modul].label um
// ev.lehrperson erweitern:
//   const haystack = [ev.title, MODS[ev.modul].label, ev.lehrperson];
function eventMatchesQuery(ev, query) {
  const q = query.toLowerCase();
  const haystack = [ev.title, MODS[ev.modul].label];
  return haystack.some(f => f.toLowerCase().includes(q));
}

function jumpToEvent(ev) {
  const [y, m] = ev.date.split('-').map(Number);
  const idx = MONTHS.findIndex(mo => mo.year === y && mo.month === (m - 1));
  if (idx !== -1) goTo(idx);
  openModal(ev);
}

const searchInput = document.getElementById('searchInput');
const searchResultsEl = document.getElementById('searchResults');

function renderSearchResults(query) {
  if (!query.trim()) {
    searchResultsEl.style.display = 'none';
    searchResultsEl.innerHTML = '';
    return;
  }
  const matches = EVENTS
    .filter(ev => eventMatchesQuery(ev, query))
    .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))
    .slice(0, 8);

  if (!matches.length) {
    searchResultsEl.innerHTML = `<div class="search-empty">Keine Treffer</div>`;
    searchResultsEl.style.display = 'block';
    return;
  }

  searchResultsEl.innerHTML = matches.map((ev, i) => {
    const m = MODS[ev.modul];
    const d = new Date(ev.date + 'T12:00:00Z');
    const dateLabel = `${d.getUTCDate()}. ${MONTH_NAMES_SHORT[d.getUTCMonth()]}`;
    return `<div class="search-result" data-i="${i}">
      <span class="search-result-dot" style="background:${m.dot}"></span>
      <span class="search-result-date">${dateLabel}, ${ev.start}</span>
      <span class="search-result-title">${ev.title}</span>
    </div>`;
  }).join('');
  searchResultsEl.style.display = 'block';

  searchResultsEl.querySelectorAll('.search-result').forEach(el => {
    el.addEventListener('click', () => {
      const ev = matches[Number(el.dataset.i)];
      searchResultsEl.style.display = 'none';
      searchInput.value = '';
      jumpToEvent(ev);
    });
  });
}

searchInput.addEventListener('input', () => renderSearchResults(searchInput.value));
searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) renderSearchResults(searchInput.value); });
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) searchResultsEl.style.display = 'none';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { searchResultsEl.style.display = 'none'; searchInput.blur(); }
});

const copyFeedBtn = document.getElementById('copyFeedBtn');
copyFeedBtn.addEventListener('click', () => {

    copyFeedBtn.classList.add('copied');
    setTimeout(() => { copyFeedBtn.textContent = '🔗 Link kopieren'; copyFeedBtn.classList.remove('copied'); }, 2000);
  });

    padding: 36px 40px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,.08);
    text-align: center;
  }
  #pw-box h2 {
    font-size: 18px;
    font-weight: 700;
    color: #1A1A18;
    margin-bottom: 6px;
    letter-spacing: -.2px;
  }
  #pw-box p {
    font-size: 13px;
    color: #7A7870;
    margin-bottom: 22px;
  }
  #pw-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #E2E0D8;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
    margin-bottom: 12px;
    transition: border-color .15s;
  }
  #pw-input:focus { border-color: #5B3FC8; }
  #pw-btn {
    width: 100%;
    padding: 10px;
    background: #1A1A18;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  #pw-btn:hover { background: #333330; }
  #pw-error {
    margin-top: 10px;
    font-size: 13px;
    color: #C41A50;
    display: none;
  }
</style>

<div id="pw-overlay">
  <div id="pw-box">
    <h2>Vorlesungskalender</h2>
    <p>Bitte Passwort eingeben</p>
    <input id="pw-input" type="password" placeholder="Passwort" autofocus />
    <button id="pw-btn">Weiter</button>
    <div id="pw-error">Falsches Passwort – bitte erneut versuchen.</div>
  </div>
</div>

<script>
  (function() {
    const HASH = "d05559479cafb662e307f4642792a5c383cd17f51af80d77894025981699d1a9";
    function sha256(str) {
      // Simple check: compare to stored hash via subtle crypto
      const enc = new TextEncoder();
      return crypto.subtle.digest('SHA-256', enc.encode(str)).then(buf =>
        Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('')
      );
    }
    const SESSION_KEY = 'ws2627_auth';
    if (sessionStorage.getItem(SESSION_KEY) === '1') {
      document.getElementById('pw-overlay').style.display = 'none';
    }
    function check() {
      const val = document.getElementById('pw-input').value;
      sha256(val).then(hash => {
        if (hash === HASH) {
          sessionStorage.setItem(SESSION_KEY, '1');
          document.getElementById('pw-overlay').style.display = 'none';
        } else {
          document.getElementById('pw-error').style.display = 'block';
          document.getElementById('pw-input').value = '';
          document.getElementById('pw-input').focus();
        }
      });
    }
    document.getElementById('pw-btn').addEventListener('click', check);
    document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  })();
</script>
</body>
</html>
